stages:
  - lint
  - test
  - docker
  - security
  - docs
  - provenance
  - deploy

lint:
  stage: lint
  image: python:3.11-slim
  tags: [cryptotrader]
  script:
    - pip install --quiet uv==0.11.6
    - uv sync --frozen --extra dev
    - uv run ruff check cryptotrader/ tests/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

test:
  stage: test
  image: python:3.11-slim
  tags: [cryptotrader]
  script:
    - pip install --quiet uv==0.11.6
    - uv sync --frozen --extra dev
    - uv run pytest tests/ -v --tb=short --cov=cryptotrader --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

docker:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags: [cryptotrader]
  variables:
    REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE"
  before_script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}"
      > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${REGISTRY_IMAGE}:latest"
      --insecure
      --skip-tls-verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

trivy-dep:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags: [cryptotrader]
  variables:
    TRIVY_CACHE_DIR: .trivycache/
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln "${CI_PROJECT_DIR}"
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

trivy-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags: [cryptotrader]
  variables:
    TRIVY_CACHE_DIR: .trivycache/
    TRIVY_NO_PROGRESS: "true"
    TRIVY_INSECURE: "true"
  before_script:
    - mkdir -p ~/.docker
    - >
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}"
      > ~/.docker/config.json
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

deploy-staging:
  stage: deploy
  tags: [cryptotrader]
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$PI_SSH_PRIVATE_KEY" | base64 -d > /tmp/pi_key
    - chmod 600 /tmp/pi_key
    - ssh-add /tmp/pi_key
    - rm /tmp/pi_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PI_SSH_HOST_KEY" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - DEPLOY_PATH=/opt/cryptotrader-staging SERVICE_NAME=cryptotrader-staging bash deploy/deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  environment:
    name: staging
    url: http://your-pi-host
    deployment_tier: staging

deploy:
  stage: deploy
  tags: [cryptotrader]
  image: alpine:latest
  needs: [deploy-staging]
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$PI_SSH_PRIVATE_KEY" | base64 -d > /tmp/pi_key
    - chmod 600 /tmp/pi_key
    - ssh-add /tmp/pi_key
    - rm /tmp/pi_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PI_SSH_HOST_KEY" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - bash deploy/deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    url: http://your-pi-host
    deployment_tier: production

provenance:
  stage: provenance
  image: python:3.11-slim
  tags: [cryptotrader]
  script:
    - |
      # Install cosign (arch-aware)
      apt-get update -qq && apt-get install -y -qq curl
      ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
      curl -sSfL "https://github.com/sigstore/cosign/releases/download/v3.0.5/cosign-linux-${ARCH}" \
        -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

      # Generate SLSA v0.2 provenance
      python3 - <<'PYEOF'
      import json, os

      provenance = {
        "_type": "https://in-toto.io/Statement/v0.1",
        "predicateType": "https://slsa.dev/provenance/v0.2",
        "subject": [
          {
            "name": os.environ["CI_PROJECT_NAME"],
            "digest": {"sha1": os.environ["CI_COMMIT_SHA"]}
          }
        ],
        "predicate": {
          "builder": {
            "id": f"{os.environ['CI_PROJECT_URL']}/-/pipelines/{os.environ['CI_PIPELINE_ID']}"
          },
          "buildType": "https://gitlab.com/gitlab-org/gitlab-runner/-/blob/main/PROCESS.md",
          "invocation": {
            "configSource": {
              "uri": f"{os.environ['CI_PROJECT_URL']}@{os.environ['CI_COMMIT_SHA']}",
              "digest": {"sha1": os.environ["CI_COMMIT_SHA"]},
              "entryPoint": ".gitlab-ci.yml"
            },
            "parameters": {
              "CI_PIPELINE_SOURCE": os.environ.get("CI_PIPELINE_SOURCE", ""),
              "CI_COMMIT_REF_NAME": os.environ.get("CI_COMMIT_REF_NAME", "")
            },
            "environment": {
              "CI_RUNNER_ID": os.environ.get("CI_RUNNER_ID", ""),
              "CI_RUNNER_DESCRIPTION": os.environ.get("CI_RUNNER_DESCRIPTION", "")
            }
          },
          "metadata": {
            "buildInvocationId": os.environ["CI_JOB_ID"],
            "buildStartedOn": os.environ.get("CI_PIPELINE_CREATED_AT", ""),
            "completeness": {
              "parameters": True,
              "environment": False,
              "materials": False
            },
            "reproducible": False
          },
          "materials": [
            {
              "uri": os.environ["CI_PROJECT_URL"],
              "digest": {"sha1": os.environ["CI_COMMIT_SHA"]}
            }
          ]
        }
      }

      with open("provenance.json", "w") as f:
        json.dump(provenance, f, indent=2)

      print("SLSA Level 2 provenance generated:")
      print(json.dumps(provenance, indent=2))
      PYEOF

      # Sign provenance with cosign key-pair (SLSA Level 2 — authenticated provenance)
      echo "$COSIGN_PRIVATE_KEY" | base64 -d > /tmp/cosign.key
      COSIGN_PASSWORD="$COSIGN_PASSWORD" cosign sign-blob \
        --key /tmp/cosign.key \
        --bundle provenance.bundle \
        --yes \
        provenance.json
      rm -f /tmp/cosign.key
  artifacts:
    name: "provenance-$CI_COMMIT_SHORT_SHA"
    paths:
      - provenance.json
      - provenance.bundle
    expire_in: 1 year
  rules:
    # Provenance signing needs the protected COSIGN_* variables, which are only exposed on the
    # protected `main` branch. Gate the job to main so it doesn't run (and fail) on MR/feature
    # branches where those secrets are unavailable.
    - if: '$CI_COMMIT_BRANCH == "main"'

# Operator manual + generated API reference, published to GitLab Pages.
# Deliberately does NOT gate deploys: a docs failure must never block shipping
# a fix. `pages` is GitLab's reserved job name for publishing `public/`.
pages:
  stage: docs
  image: python:3.11-slim
  tags: [cryptotrader]
  script:
    - pip install --quiet uv==0.11.6
    - uv sync --frozen --extra dev
    - uv run python3 scripts/build_docs.py
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
      allow_failure: true
