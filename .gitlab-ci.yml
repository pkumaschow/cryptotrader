stages:
  - lint
  - test
  - deploy
  - provenance

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  image: python:3.11-slim
  tags: [cryptotrader]
  script:
    - pip install --quiet ruff
    - ruff check cryptotrader/ tests/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

test:
  stage: test
  image: python:3.11-slim
  tags: [cryptotrader]
  script:
    - pip install --quiet -e ".[dev]"
    - pytest tests/ -v --tb=short --cov=cryptotrader --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

deploy:
  stage: deploy
  tags: [cryptotrader]
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$PI_SSH_PRIVATE_KEY" | base64 -d > /tmp/pi_key
    - chmod 600 /tmp/pi_key
    - ssh-add /tmp/pi_key
    - rm /tmp/pi_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - bash deploy/deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual   # run manually via GitLab UI until runner is configured
  environment:
    name: production
    url: http://pihole.homelab.com
    deployment_tier: production

provenance:
  stage: provenance
  image: python:3.11-slim
  tags: [cryptotrader]
  script:
    - |
      # Install cosign
      apt-get update -qq && apt-get install -y -qq curl
      curl -sSfL https://github.com/sigstore/cosign/releases/download/v3.0.5/cosign-linux-amd64 \
        -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign

      # Generate SLSA v0.2 provenance
      python3 - <<'PYEOF'
      import json, os

      provenance = {
        "_type": "https://in-toto.io/Statement/v0.1",
        "predicateType": "https://slsa.dev/provenance/v0.2",
        "subject": [
          {
            "name": os.environ["CI_PROJECT_NAME"],
            "digest": {"sha1": os.environ["CI_COMMIT_SHA"]}
          }
        ],
        "predicate": {
          "builder": {
            "id": f"{os.environ['CI_PROJECT_URL']}/-/pipelines/{os.environ['CI_PIPELINE_ID']}"
          },
          "buildType": "https://gitlab.com/gitlab-org/gitlab-runner/-/blob/main/PROCESS.md",
          "invocation": {
            "configSource": {
              "uri": f"{os.environ['CI_PROJECT_URL']}@{os.environ['CI_COMMIT_SHA']}",
              "digest": {"sha1": os.environ["CI_COMMIT_SHA"]},
              "entryPoint": ".gitlab-ci.yml"
            },
            "parameters": {
              "CI_PIPELINE_SOURCE": os.environ.get("CI_PIPELINE_SOURCE", ""),
              "CI_COMMIT_REF_NAME": os.environ.get("CI_COMMIT_REF_NAME", "")
            },
            "environment": {
              "CI_RUNNER_ID": os.environ.get("CI_RUNNER_ID", ""),
              "CI_RUNNER_DESCRIPTION": os.environ.get("CI_RUNNER_DESCRIPTION", "")
            }
          },
          "metadata": {
            "buildInvocationId": os.environ["CI_JOB_ID"],
            "buildStartedOn": os.environ.get("CI_PIPELINE_CREATED_AT", ""),
            "completeness": {
              "parameters": True,
              "environment": False,
              "materials": False
            },
            "reproducible": False
          },
          "materials": [
            {
              "uri": os.environ["CI_PROJECT_URL"],
              "digest": {"sha1": os.environ["CI_COMMIT_SHA"]}
            }
          ]
        }
      }

      with open("provenance.json", "w") as f:
        json.dump(provenance, f, indent=2)

      print("SLSA Level 2 provenance generated:")
      print(json.dumps(provenance, indent=2))
      PYEOF

      # Sign provenance with cosign key-pair (SLSA Level 2 — authenticated provenance)
      echo "$COSIGN_PRIVATE_KEY" | base64 -d > /tmp/cosign.key
      COSIGN_PASSWORD="$COSIGN_PASSWORD" cosign sign-blob \
        --key /tmp/cosign.key \
        --bundle provenance.bundle \
        --yes \
        provenance.json
      rm -f /tmp/cosign.key
  artifacts:
    name: "provenance-$CI_COMMIT_SHORT_SHA"
    paths:
      - provenance.json
      - provenance.bundle
    expire_in: 1 year
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
