name: Docs

# Publishes the operator manual and generated API reference to GitHub Pages.
#
# The same site is built by the GitLab pipeline, from the same script, so the
# two cannot diverge. GitHub is where it is publicly readable: the GitLab
# instance serves Pages behind a login, which is no use to someone who pulled
# the Docker image.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway: a half-published site is worse than a stale
# one. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet uv==0.11.6
      - run: uv sync --frozen --extra dev
      - run: uv run python3 scripts/build_docs.py
      - name: Fail if the build produced nothing
        # build_docs exits 0 even if pdoc emitted no pages, so check the output
        # rather than trusting the exit code — publishing an empty site would
        # look like a successful deploy.
        run: |
          test -f public/index.html || { echo "no manual page built"; exit 1; }
          test -f public/api/cryptotrader.html || { echo "no API reference built"; exit 1; }
          echo "built $(find public -name '*.html' | wc -l) pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
