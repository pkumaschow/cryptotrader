[mode]
# test mode runs ALL 4 strategies simultaneously for comparison (bollinger, ema, threshold, trend_pullback)
active = "test"
max_daily_loss_usd = 50.00

[database]
path = "cryptotrader.db"

[websocket]
stale_threshold = 30
stats_refresh_interval = 5

[currencies."BTC/USD"]
strategy = "bollinger"
quantity = 0.001
max_order_usd = 500.00

[currencies."BTC/USD".threshold]
buy_trigger = 65000.00
sell_trigger = 68000.00

[currencies."BTC/USD".bollinger]
min_band_width_pct = 4.0    # large-cap: stricter breakout filter
trend_filter_enabled = true # 4h EMA50 must be rising

[currencies."ETH/USD"]
strategy = "bollinger"
quantity = 0.03
max_order_usd = 500.00

[currencies."ETH/USD".threshold]
buy_trigger = 1900.00
sell_trigger = 2050.00

[currencies."ETH/USD".bollinger]
min_band_width_pct = 4.0    # large-cap: stricter breakout filter
trend_filter_enabled = true # 4h EMA50 must be rising

[currencies."XDG/USD"]
strategy = "bollinger"
quantity = 100
max_order_usd = 500.00

[currencies."XDG/USD".threshold]
buy_trigger = 0.080
sell_trigger = 0.120

[currencies."XDG/USD".bollinger]
min_band_width_pct = 2.0
trend_filter_enabled = false # high-vol: breakout edge does not need a trend gate

[currencies."XLM/USD"]
strategy = "bollinger"
quantity = 50
max_order_usd = 500.00

[currencies."XLM/USD".threshold]
buy_trigger = 0.130
sell_trigger = 0.200

[currencies."XLM/USD".bollinger]
min_band_width_pct = 2.0
trend_filter_enabled = false # high-vol: breakout edge does not need a trend gate

[currencies."BABY/USD"]
strategy = "bollinger"
quantity = 500
max_order_usd = 500.00

[currencies."BABY/USD".threshold]
buy_trigger = 0.012
sell_trigger = 0.020

[currencies."BABY/USD".bollinger]
min_band_width_pct = 2.0
trend_filter_enabled = false # high-vol: filter HURTS here (backtest +0.57 -> -0.60)
