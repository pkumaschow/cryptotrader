fee_pct = 0.80              # Kraken taker fee, % of notional per leg — a mid-band exit must clear both legs (0 = gate off)
trend_filter_enabled = true # only buy breakouts when the 4h EMA50 trend is rising
stop_loss_pct = 10.0        # exit if close falls this % below entry — caps losses, stops indefinite bag-holding (0 = off)

[currencies."SOL/USD"]
strategy = "bollinger"
quantity = 0.5
max_order_usd = 500.00  # hard cap — refuse any order exceeding this USD value

[currencies."SOL/USD".threshold]
