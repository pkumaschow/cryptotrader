[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptotrader"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "aiohttp>=3.13.4",
    "textual>=0.89",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aioresponses>=0.7",
    "ruff>=0.6",
    "pre-commit>=3.0",
    "pdoc>=15.0",
]

[project.scripts]
cryptotrader = "cryptotrader.main:main"
cryptotrader-stats = "scripts.stats:main"
cryptotrader-report = "scripts.report:main"
cryptotrader-deposit = "scripts.deposit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptotrader*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "exchange_http: drives the Kraken HTTP layer against a mock transport; exempt from the outbound-call block in conftest",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax for py3.11)
    "B",   # flake8-bugbear (common bug patterns)
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
    # pydocstyle. The package is at 100% for these four as of 1.2.0, so they
    # are enforced to keep it there: an undocumented public symbol fails CI
    # rather than quietly eroding the generated reference. The remaining D
    # rules govern formatting (summary mood, blank lines) and are deliberately
    # left off — they would flag existing prose without making it clearer.
    "D100",  # module
    "D101",  # public class
    "D102",  # public method
    "D103",  # public function
]
ignore = [
    "S101", # allow assert (used in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D100", "D101", "D102", "D103"]  # test names carry the intent
"scripts/**" = ["D100", "D103"]   # CLI entry points carry --help text instead
# Textual: mutable class-level BINDINGS/CSS, and lifecycle hooks (compose,
# on_mount) that document nothing useful. tui/ is excluded from the generated
# reference for the same reason.
"cryptotrader/tui/**" = ["RUF012", "D101", "D102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
