[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptotrader"
version = "1.1.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "aiohttp>=3.13.4",
    "textual>=0.89",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aioresponses>=0.7",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[project.scripts]
cryptotrader = "cryptotrader.main:main"
cryptotrader-stats = "scripts.stats:main"
cryptotrader-report = "scripts.report:main"
cryptotrader-deposit = "scripts.deposit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptotrader*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax for py3.11)
    "B",   # flake8-bugbear (common bug patterns)
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101", # allow assert (used in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"cryptotrader/tui/**" = ["RUF012"]  # Textual framework uses mutable class-level BINDINGS/CSS

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
